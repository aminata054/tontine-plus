<ion-content [fullscreen]="true" class="success-content">
  <app-page-header></app-page-header>
  <!-- Chargement -->
  <div class="sc-result" *ngIf="status === 'loading'">
    <div class="sc-result__spinner">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p class="sc-result__loading-text">Chargement…</p>
    </div>
  </div>

  <!-- Succès -->
  <app-state-screen *ngIf="status === 'success'" type="celebration" title="Félicitations !"
    subtitle="Votre tontine a été créée avec succès ! Invitez dès maintenant les membres du groupe."
    buttonText="Partager le lien" [showSecondaryButton]="true" secondaryButtonText="Afficher le QR Code"
    secondaryButtonFill="outline" (buttonClick)="openShareModal()" (secondaryButtonClick)="openQrModal()">
  </app-state-screen>

  <!-- Erreur -->
  <app-state-screen *ngIf="status === 'error'" type="error" title="Erreur !"
    subtitle="Impossible de charger les informations de la tontine." buttonText="Retour" (buttonClick)="goToList()">
  </app-state-screen>

</ion-content>
