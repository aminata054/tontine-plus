<ion-content>
  <app-page-header title="Mon compte" />
  <input #fileInput type="file" accept="image/*" style="display:none" (change)="onFileSelected($event)" />
  <div class="account-container">

    <!-- Avatar -->
    <div class="avatar-wrapper" (click)="onAvatarClick()">
      <img *ngIf="photoPreview" [src]="photoPreview" class="avatar-img" alt="Photo de profil" />
      <div *ngIf="!photoPreview" class="avatar-initials">
        {{ getInitials() }}
      </div>
      <div class="avatar-badge">
        <ion-icon name="camera-outline"></ion-icon>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="form-fields">
      <app-custom-input label="Nom complet" [(value)]="fullName" placeholder="Aissatou Drame" />
      <app-custom-input label="Adresse email" type="email" [(value)]="email" placeholder="aissatou@email.com" />
      <!-- Téléphone : lecture seule -->
      <app-custom-input label="Téléphone" [value]="user?.phoneNumber ?? ''" [readonly]="true" />
    </div>

    <app-custom-button color="primary" expand="block" [disabled]="!fullName.trim()" (clicked)="save()">
      Modifier
    </app-custom-button>

  </div>
</ion-content>
