<ion-content>
  <app-page-header [title]="title" />

  <div class="pin-container">

    <p class="pin-subtitle">{{ subtitle }}</p>

    <app-otp-input [length]="4" [mask]="true" (completed)="onPinCompleted($event)" />

    <p class="pin-error" *ngIf="errorMessage">{{ errorMessage }}</p>

  </div>
</ion-content>
