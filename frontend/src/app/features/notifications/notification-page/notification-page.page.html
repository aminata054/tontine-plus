<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-page-header title="Notifications"></app-page-header>

  <div class="notif-header">
    <div class="notif-header__top">
      <div class="notif-header__actions">
        <button class="action-btn action-btn--mark-read" *ngIf="unreadCount > 0" (click)="markAllRead()">
          Tout marquer lu
        </button>

        <button class="action-btn action-btn--delete-all" *ngIf="notifications.length > 0" (click)="deleteAllConfirm()">
          <ion-icon name="trash-outline"></ion-icon>
          <span class="action-btn__text">Tout supprimer</span>
        </button>
      </div>
    </div>

    <!-- Filtres -->
    <div class="notif-filters">
      <button class="filter-pill" [class.filter-pill--active]="activeFilter === 'all'" (click)="setFilter('all')">
        Toutes
      </button>
      <button class="filter-pill" [class.filter-pill--active]="activeFilter === 'unread'" (click)="setFilter('unread')">
        Non lues
        <span *ngIf="unreadCount > 0" class="filter-pill__dot"></span>
      </button>
    </div>
  </div>

  <!-- Skeletons -->
  <div *ngIf="isLoading" class="notif-list">
    <div *ngFor="let i of [1,2,3,4,5]" class="notif-skeleton">
      <div class="notif-skeleton__icon">
        <ion-skeleton-text animated style="width:100%;height:100%;border-radius:50%"></ion-skeleton-text>
      </div>
      <div class="notif-skeleton__content">
        <ion-skeleton-text animated
          style="width:70%;height:14px;border-radius:6px;margin-bottom:6px"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:90%;height:12px;border-radius:6px"></ion-skeleton-text>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && notifications.length === 0" class="empty-state">
    <div class="empty-state__icon">
      <ion-icon name="notifications-outline"></ion-icon>
    </div>
    <p class="empty-state__title">Aucune notification</p>
    <p class="empty-state__subtitle">
      {{ activeFilter === 'unread' ? 'Tout est à jour !' : 'Vous êtes à jour.' }}
    </p>
  </div>

  <!-- Liste des notifications -->
  <div *ngIf="!isLoading && notifications.length > 0" class="notif-list">

    <!-- Groupe Aujourd'hui -->
    <ng-container *ngIf="todayNotifs.length > 0">
      <div class="notif-group-label">
        Aujourd'hui
        <button *ngIf="todayUnread > 0" class="group-mark-read" (click)="markAllRead()">
          Tout marquer lu
        </button>
      </div>
      <ng-container *ngTemplateOutlet="notifList; context: { notifs: todayNotifs }"></ng-container>
    </ng-container>

    <!-- Groupe Hier -->
    <ng-container *ngIf="yesterdayNotifs.length > 0">
      <div class="notif-group-label">Hier</div>
      <ng-container *ngTemplateOutlet="notifList; context: { notifs: yesterdayNotifs }"></ng-container>
    </ng-container>

    <!-- Groupe Précédemment -->
    <ng-container *ngIf="olderNotifs.length > 0">
      <div class="notif-group-label">Précédemment</div>
      <ng-container *ngTemplateOutlet="notifList; context: { notifs: olderNotifs }"></ng-container>
    </ng-container>
  </div>

  <ion-infinite-scroll (ionInfinite)="loadMore($event)" [disabled]="currentPage >= totalPages">
    <ion-infinite-scroll-content loadingText="Chargement..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<!-- Template réutilisable  -->
<ng-template #notifList let-notifs="notifs">
  <ion-item-sliding *ngFor="let notif of notifs; trackBy: trackById" #slidingItem>

    <ion-item-options side="start" *ngIf="!notif.isRead">
      <ion-item-option color="primary" (click)="markAsRead(notif, slidingItem)">
        <ion-icon slot="icon-only" name="checkmark-done-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>

    <ion-item lines="full" class="notif-item" [class.notif-item--unread]="!notif.isRead" (click)="markAsRead(notif)">

      <div class="notif-icon-wrap notif-icon-wrap--{{ getNotifColor(notif.type) }}" slot="start">
        <ion-icon [name]="getNotifIcon(notif.type)"></ion-icon>
      </div>

      <div class="notif-content">
        <div class="notif-content__header">
          <span class="notif-content__title">{{ notif.title }}</span>
        </div>
        <p class="notif-content__body">{{ notif.body }}</p>
      </div>

      <div *ngIf="!notif.isRead" class="notif-dot" slot="end"></div>
    </ion-item>

    <ion-item-options side="end">
      <ion-item-option color="danger" (click)="deleteNotif(notif, slidingItem)">
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ng-template>
