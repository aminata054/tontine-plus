<ion-content class="alert-modal-content">
  <div class="alert-container">

    <button class="close-btn" (click)="dismiss()">
      <ion-icon name="close-outline"></ion-icon>
    </button>

    <div class="icon-wrapper" [ngClass]="type">
      <ion-icon [name]="iconName"></ion-icon>
    </div>

    <h2 class="alert-title">{{ title }}</h2>
    <p class="alert-message" *ngIf="message">{{ message }}</p>

    <div class="extra-content" *ngIf="extraData?.length">
      <div class="info-row" *ngFor="let item of extraData">
        <span class="info-label">{{ item.label }}</span>
        <span class="info-value">{{ item.value }}</span>
      </div>
    </div>

    <!-- Sélecteur membres (mode manual) -->
    <div class="member-select-wrapper" *ngIf="selectableMembers.length > 0">
      <p class="select-label">Premier bénéficiaire</p>
      <div class="select-box" [class.selected]="!!selectedMemberUid">
        <ion-select placeholder="Choisir un membre…" interface="action-sheet" cancelText="Annuler"
          [value]="selectedMemberUid" (ionChange)="onMemberChange($event)">
          <ion-select-option *ngFor="let m of selectableMembers" [value]="m.uid">
            {{ m.name }}
          </ion-select-option>
        </ion-select>
      </div>
      <p class="select-hint" *ngIf="!selectedMemberUid">
        <ion-icon name="information-circle-outline"></ion-icon>
        Sélection requise pour confirmer
      </p>
    </div>

    <div class="alert-buttons">
      <button class="alert-btn alert-btn--cancel" (click)="dismiss()">
        {{ cancelText }}
      </button>
      <button class="alert-btn alert-btn--confirm" [class.danger]="confirmColor === 'danger'"
        [class.success]="confirmColor === 'success'" [class.primary]="confirmColor === 'primary'"
        [disabled]="!canConfirm" (click)="onConfirm()">
        {{ confirmText }}
      </button>
    </div>

  </div>
</ion-content>
