<div class="state-screen">

  <!-- Illustration SVG -->
  <div class="illustration">
    <img [src]="'assets/icon/' + getIconFile()" [alt]="type" class="state-icon">
  </div>

  <!-- Titre -->
  <h1 class="title">{{ title }}</h1>

  <!-- Sous-titre -->
  <p class="subtitle" [innerHTML]="subtitle"></p>

  <!-- Bouton principal -->
  <app-custom-button *ngIf="buttonText" color="primary" expand="block" (click)="onButtonClick()">
    {{ buttonText }}
  </app-custom-button>

  <!-- Bouton secondaire optionnel -->
  <app-custom-button *ngIf="showSecondaryButton" [fill]="secondaryButtonFill" expand="block"
    (click)="onSecondaryButtonClick()">
    {{ secondaryButtonText }}
  </app-custom-button>
  
  <!-- Divider "Ou" -->
  <div class="divider-or" *ngIf="showDivider">
    <span>{{ dividerText }}</span>
  </div>
  
  <!-- Lien texte secondaire (déjà existant) -->
  <a *ngIf="secondaryText" class="secondary-link" (click)="onSecondaryClick()">
    {{ secondaryText }}
  </a>

  <!-- Lien secondaire -->
  <a *ngIf="secondaryText" class="secondary-link" (click)="onSecondaryClick()">
    {{ secondaryText }}
  </a>

</div>
