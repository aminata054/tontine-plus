<ion-content class="onboarding-content">
  <div class="onboarding-layout">

    <!-- Zone image (haut) -->
    <div class="slide-images">
      <swiper-container #swiper init="false" class="mySwiper">
        <swiper-slide *ngFor="let slide of slides">
          <div class="image-wrapper">
            <img [src]="slide.image" [alt]="slide.title" />
          </div>
        </swiper-slide>
      </swiper-container>
    </div>

    <!-- Zone texte (milieu) -->
    <div class="slide-text">
      <h2 class="slide-title">{{ slides[currentSlide].title }}</h2>
      <p class="slide-description">{{ slides[currentSlide].description }}</p>
    </div>

    <!-- Zone actions (bas) -->
    <div class="bottom-bar">
      <button class="btn-skip" (click)="onSkip()">Passer</button>

      <app-dot-indicator [total]="slides.length" [current]="currentSlide">
      </app-dot-indicator>

      <button class="btn-next" (click)="onNext()">
        {{ currentSlide === slides.length - 1 ? 'Commencer' : 'Suivant' }}
      </button>
    </div>

  </div>
</ion-content>
